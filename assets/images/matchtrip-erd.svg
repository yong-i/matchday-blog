<svg xmlns="http://www.w3.org/2000/svg" width="740" height="604" viewBox="0 0 740 604" role="img" aria-labelledby="title desc">
<title id="title">직관 가는 날 ERD 초안</title>
<desc id="desc">경기장은 여러 관람 계획에서 참조한다. 관람 계획은 여러 일정 항목을 가지며, 각 일정 항목은 한 방문 장소를 참조한다.</desc>
<defs>
